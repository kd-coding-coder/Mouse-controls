<!DOCTYPE html>
<html>
    <head>
        <title>Mouse Events with Functions</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


        <style>
        #mydiv{
            width: 100%;
            /* Make the div width 100% of its container */
            height: 200px;
            background-color: azure;
            border: 2px solid blue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 10px;
                /* Add space below the div */
        }
        #log{
            margin-top: 20px;
            padding: 10px;
            border: 1px solid rgb(27, 196, 205);
            background-color: rgb(248, 196, 255);
            font-family: cursive;
            height: 200px;
            overflow-y: auto;

        }
        </style>


    </head>
    <body class="d-flex justify-content-center align-items-center vh-100 bg-light" onload="welcome();">
        <div class="container">
            <div id="mydiv" class="rounded shadow-sm mb-3" onmouseover="myover()" onmouseout="myout()" onmousedown="mydown()" onmouseup="myup()"  ondblclick="mydblclick()">
                Hover and Click Me!!
            </div>

            <button class="btn btn-primary w-100" onclick="mybuttonclick()">Click Me !</button>
     <div id="log" class="mt-4">
<strong>Event Log:</strong>
     </div>
        </div>


        <script>
            // Function to change background color when page loads
            function welcome() { 
                document.body.style.backgroundColor= "pink";
                logEvent("Page loaded: Body color changed to pink")
            }

            function myout() {
                document.getElementById("mydiv").style.backgroundColor = "skyblue";
                logEvent("Mouse out: Div color changed to blue");
            }

            function myover() {
                document.getElementById("mydiv").style.backgroundColor = "lavender";
                logEvent("Mouse over: Div color changed to lavender");
            }

            function mydown() {
                document.getElementById("mydiv").style.backgroundColor = "yellow";
                logEvent("Mouse down: Div color changed to yellow");
            }

            function myup() {
                document.getElementById("mydiv").style.backgroundColor = "orange";
                logEvent("Mouse up: Div color changed to orange");
            }

            

            function mydblclick() {
                document.getElementById("mydiv").style.backgroundColor = "beige";
                logEvent("Mouse double clicked: Div color changed to beige");
            }

            function mybuttonclick(){
                logEvent("Button clicked")
             
            }

            function logEvent(message) {
                const log = document.getElementById('log');
                const logEntry = document.createElement('div');
                logEntry.textContent = message;
                log.appendChild(logEntry);
                log.scrollTop = log.scrollHeight; //Auto-scroll to the bottom
            }




        </script>
    </body>
    
</html>
